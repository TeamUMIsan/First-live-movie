<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>動画自動再生テスト</title>
</head>
<body style="margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <!-- muted（消音）と playsinline（スマホ用）が入っていることで自動再生されます -->
  <video src="video.mp4" autoplay muted playsinline controls style="max-width: 90%; height: auto;"></video>

</body>
</html>
